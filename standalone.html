<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fractal Notes Distill — standalone</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%8C%80%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f6f6f8;--panel:#fff;--ink:#1c1c24;--muted:#70707e;--line:#e4e4ea;--accent:#6d5ae6;--accent-2:#0ea5a4;--dot:#3f3f4a;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#101014;--panel:#17171d;--ink:#ececf2;--muted:#9b9ba7;--line:#26262e;--dot:#c9c9d4}}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:16px;padding:10px 20px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap;user-select:none}
.crumbs{display:flex;align-items:center;gap:2px;flex:1;min-width:0;overflow:hidden}
.crumb{color:var(--muted);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:2px 6px;border-radius:6px}
button.crumb:hover{background:var(--line);color:var(--ink)}
.crumb.current{color:var(--ink);font-weight:600}
.crumb-sep{color:var(--muted);opacity:.6}
.actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.count{color:var(--muted);font-size:13px;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:8px;font-size:13.5px;font-weight:500;white-space:nowrap;transition:filter .15s,background .15s}
.btn:hover{filter:brightness(.97)}
.btn.ghost{background:transparent}.btn.ghost:hover{background:var(--line);filter:none}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border:none;color:#fff}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;max-width:1200px;margin:0 auto;padding:28px 20px 80px}
.layout.with-panel{grid-template-columns:minmax(0,1fr) 360px}
@media (max-width:980px){.layout.with-panel{grid-template-columns:minmax(0,1fr)}}
.page{max-width:760px;width:100%;margin:0 auto}
.page-title{display:block;width:100%;border:none;outline:none;background:transparent;font-size:30px;font-weight:750;letter-spacing:-.02em;padding:4px 0 14px}
.page-title::placeholder,.note-input::placeholder{color:var(--muted);opacity:.55}
.row{display:flex;align-items:center;gap:2px;padding:1px 0;border-radius:8px}
.row:focus-within{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.chevron{width:20px;height:24px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;opacity:0;transition:opacity .12s,transform .12s}
.node:hover>.row>.chevron,.chevron.closed{opacity:1}
.chevron.closed{transform:rotate(-90deg)}
.chevron.hidden{visibility:hidden}
.dot{width:20px;height:24px;flex:none;display:flex;align-items:center;justify-content:center}
.dot::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--dot);transition:box-shadow .12s,background .12s}
.dot:hover::before{box-shadow:0 0 0 4px var(--line);background:var(--accent)}
.dot.full::before{box-shadow:0 0 0 3px var(--line)}
.note-input{flex:1;min-width:0;border:none;outline:none;background:transparent;padding:3px 6px;border-radius:6px}
.children{margin-left:29px;border-left:1px solid var(--line);padding-left:4px}
.add-row{display:flex;align-items:center;gap:8px;color:var(--muted);padding:8px 6px;margin-top:6px;border-radius:8px;font-size:14px}
.add-row:hover{color:var(--ink);background:var(--line)}
.hints{display:flex;flex-wrap:wrap;gap:14px;margin-top:40px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}
kbd{border:1px solid var(--line);border-bottom-width:2px;background:var(--panel);border-radius:5px;padding:0 5px;font-size:11.5px;font-family:inherit}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;height:fit-content;position:sticky;top:70px;box-shadow:0 8px 28px rgba(0,0,0,.06)}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px}
.panel-title{font-weight:650}
.badge{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 8px;margin-top:6px;background:color-mix(in srgb,var(--accent-2) 15%,transparent);color:var(--accent-2)}
.panel-note{color:var(--muted);font-size:13px;margin:8px 0 0}
.panel-body{font-size:14px}
.panel-body ul{padding-left:20px;margin:8px 0}
.panel-body li{margin:4px 0}
.panel-body p{margin:8px 0}
</style>
</head>
<body>
<header class="topbar">
  <button class="brand" id="brand">🌀 <span>Fractal Notes</span></button>
  <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
  <div class="actions">
    <span class="count" id="count"></span>
    <button class="btn ghost" id="copyBtn">Copy MD</button>
    <button class="btn primary" id="distillBtn">✨ Distill</button>
  </div>
</header>
<div class="layout" id="layout">
  <main class="page">
    <input id="title" class="page-title" placeholder="Home">
    <div id="tree"></div>
    <button class="add-row" id="addBtn">+ New note</button>
    <footer class="hints">
      <span><kbd>Enter</kbd> new note</span>
      <span><kbd>Tab</kbd>/<kbd>Shift+Tab</kbd> indent/outdent</span>
      <span><kbd>Backspace</kbd> on empty deletes</span>
      <span>click a <b>•</b> to zoom in</span>
    </footer>
  </main>
  <aside class="panel" id="panel" hidden aria-label="Distillation result">
    <div class="panel-head">
      <div>
        <div class="panel-title" id="panelTitle"></div>
        <span class="badge">Offline</span>
      </div>
      <button class="btn ghost" id="closePanel" aria-label="Close panel">✕</button>
    </div>
    <p class="panel-note">Standalone build distills offline. For Gemini distillation, run the full app with a GEMINI_API_KEY.</p>
    <div class="panel-body" id="panelBody"></div>
  </aside>
</div>
<script>
'use strict';
(function () {
  const KEY = 'fractal-notes-distill:standalone:v1';
  const uid = () =>
    typeof crypto !== 'undefined' && crypto.randomUUID
      ? crypto.randomUUID()
      : Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  const note = (text, children) => ({ id: uid(), text, children: children || [] });

  const seed = () => ({
    id: uid(),
    text: 'Home',
    children: [
      note('Welcome to Fractal Notes 🌀', [
        note('Every bullet is a page of its own — click its dot to zoom in.'),
        note('Enter adds a note, Tab indents, Shift+Tab outdents.'),
        note('Backspace on an empty note deletes it; the chevron collapses a branch.'),
      ]),
      note('Distill any branch ✨', [
        note('Zoom into a branch, then press Distill to reduce it to its essence.'),
        note('This standalone file always distills offline — no install, no network.'),
      ]),
    ],
  });

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed.id === 'string' && Array.isArray(parsed.children)) return parsed;
      }
    } catch (e) { /* fall through to seed */ }
    return null;
  }

  let root = load() || seed();
  let zoomId = root.id;
  let focusReq = null;

  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(root)); } catch (e) {} };
  const find = (n, id) => {
    if (n.id === id) return n;
    for (const c of n.children) { const f = find(c, id); if (f) return f; }
    return null;
  };
  const findPath = (n, id) => {
    if (n.id === id) return [n];
    for (const c of n.children) { const p = findPath(c, id); if (p) return [n].concat(p); }
    return null;
  };
  const parentOf = (n, id) => {
    for (const c of n.children) { if (c.id === id) return n; const f = parentOf(c, id); if (f) return f; }
    return null;
  };
  const visible = n => {
    const out = [];
    const walk = x => x.children.forEach(c => { out.push(c); if (!c.collapsed) walk(c); });
    walk(n);
    return out;
  };
  const count = n => { let k = 0; const walk = x => x.children.forEach(c => { k++; walk(c); }); walk(n); return k; };
  const zoomRoot = () => {
    const p = findPath(root, zoomId);
    if (p) return p[p.length - 1];
    zoomId = root.id;
    return root;
  };
  const toMarkdown = n => {
    const lines = [];
    const t = n.text.trim();
    if (t) lines.push('# ' + t, '');
    const walk = (x, d) => x.children.forEach(c => {
      lines.push(('  '.repeat(d) + '- ' + c.text.trim()).replace(/\s+$/, ''));
      walk(c, d + 1);
    });
    walk(n, 0);
    return lines.join('\n');
  };

  /* ---- offline distiller (same algorithm as services/distiller.ts) ---- */
  const STOPWORDS = new Set(('a,an,the,and,or,but,if,then,else,of,in,on,at,to,for,with,by,from,as,is,are,was,were,be,been,' +
    'being,it,its,this,that,these,those,i,you,he,she,we,they,them,his,her,our,your,their,my,me,do,' +
    'does,did,doing,have,has,had,having,will,would,can,could,should,shall,may,might,must,not,no,' +
    'so,than,too,very,just,about,into,over,under,again,further,once,here,there,when,where,why,how,' +
    'all,any,both,each,few,more,most,other,some,such,only,own,same,up,down,out,off,also,what,which,' +
    'who,whom,while,because,until,before,after,between,during,through,dont,doesnt,didnt,isnt,arent,' +
    'im,ive,youre,theyre,weve,its,thats,get,got,need,needs,make,use').split(','));
  const tokenize = text => text.toLowerCase().replace(/[^a-z0-9\s'-]/g, ' ').split(/\s+/)
    .map(w => w.replace(/^['-]+|['-]+$/g, ''))
    .filter(w => w.length > 1 && !STOPWORDS.has(w));

  function distillLocal(branch) {
    const items = [];
    const walk = (n, d) => n.children.forEach(c => {
      const t = c.text.trim();
      if (t) items.push({ text: t, depth: d, index: items.length });
      walk(c, d + 1);
    });
    walk(branch, 0);
    if (!items.length) return 'Nothing to distill yet — add a few notes to this branch first.';
    const freq = new Map();
    for (const it of items) for (const w of tokenize(it.text)) freq.set(w, (freq.get(w) || 0) + 1);
    const scored = items.map(it => {
      const words = tokenize(it.text);
      const raw = words.reduce((s, w) => s + (freq.get(w) || 0), 0);
      return Object.assign({}, it, {
        score: words.length ? (raw / Math.sqrt(words.length)) * (1 / (1 + it.depth * 0.15)) : 0,
      });
    });
    const k = Math.max(3, Math.min(7, Math.ceil(items.length * 0.25)));
    const top = scored.slice().sort((a, b) => b.score - a.score).slice(0, Math.min(k, scored.length))
      .sort((a, b) => a.index - b.index);
    const themes = Array.from(freq.entries()).filter(p => p[0].length > 2 && p[1] > 1)
      .sort((a, b) => b[1] - a[1]).slice(0, 6).map(p => p[0]);
    const title = branch.text.trim() || 'This branch';
    const lines = [
      '**' + title + '** — ' + items.length + ' note' + (items.length === 1 ? '' : 's') +
        ' distilled to ' + top.length + ' key point' + (top.length === 1 ? '' : 's') + ':',
      '',
    ].concat(top.map(it => '- ' + it.text));
    if (themes.length) lines.push('', '_Recurring themes: ' + themes.join(', ') + '_');
    return lines.join('\n');
  }

  const escapeHtml = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const inlineMd = s => escapeHtml(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|\s)_(.+?)_(?=$|[\s.,;:!?])/g, '$1<em>$2</em>');
  function renderLite(md) {
    const blocks = [];
    let list = [];
    const flush = () => { if (list.length) { blocks.push('<ul>' + list.join('') + '</ul>'); list = []; } };
    for (const raw of md.split('\n')) {
      const line = raw.replace(/\s+$/, '');
      const bullet = line.match(/^\s*[-*]\s+(.*)$/);
      if (bullet) { list.push('<li>' + inlineMd(bullet[1]) + '</li>'); continue; }
      flush();
      if (line.trim() === '') continue;
      blocks.push('<p>' + inlineMd(line) + '</p>');
    }
    flush();
    return blocks.join('');
  }

  /* ---- elements ---- */
  const $ = id => document.getElementById(id);
  const layoutEl = $('layout'), crumbsEl = $('crumbs'), countEl = $('count'), titleEl = $('title'),
    treeEl = $('tree'), panelEl = $('panel'), panelTitleEl = $('panelTitle'), panelBodyEl = $('panelBody');

  const hidePanel = () => { panelEl.hidden = true; layoutEl.classList.remove('with-panel'); };
  const commit = () => { save(); render(); };

  /* ---- operations ---- */
  function addNote(parent, index) {
    const n = note('');
    parent.collapsed = false;
    parent.children.splice(index == null ? parent.children.length : index, 0, n);
    focusReq = { id: n.id, caret: 0 };
    commit();
  }
  function onEnter(nod) {
    const zr = zoomRoot();
    if (nod.id === zr.id || (nod.children.length && !nod.collapsed)) { addNote(nod, 0); return; }
    const p = parentOf(root, nod.id);
    if (!p) return;
    const n = note('');
    p.children.splice(p.children.indexOf(nod) + 1, 0, n);
    focusReq = { id: n.id, caret: 0 };
    commit();
  }
  function onIndent(nod, caret) {
    const p = parentOf(root, nod.id);
    if (!p) return;
    const i = p.children.indexOf(nod);
    if (i <= 0) return;
    const prev = p.children[i - 1];
    p.children.splice(i, 1);
    prev.collapsed = false;
    prev.children.push(nod);
    focusReq = { id: nod.id, caret: caret };
    commit();
  }
  function onOutdent(nod, caret) {
    const zr = zoomRoot();
    const zp = findPath(zr, nod.id);
    if (!zp || zp.length < 3) return;
    const p = parentOf(root, nod.id);
    const g = parentOf(root, p.id);
    if (!p || !g) return;
    const i = p.children.indexOf(nod);
    const removed = p.children.splice(i);
    removed.shift();
    nod.children = nod.children.concat(removed);
    g.children.splice(g.children.indexOf(p) + 1, 0, nod);
    focusReq = { id: nod.id, caret: caret };
    commit();
  }
  function onDeleteEmpty(nod) {
    if (nod.children.length) return;
    const zr = zoomRoot();
    const vis = visible(zr);
    const i = vis.indexOf(nod);
    const prevId = i > 0 ? vis[i - 1].id : zr.id;
    const p = parentOf(root, nod.id);
    if (!p) return;
    p.children.splice(p.children.indexOf(nod), 1);
    focusReq = { id: prevId, caret: 'end' };
    commit();
  }
  function focusId(id) {
    const zr = zoomRoot();
    const el = id === zr.id ? titleEl : treeEl.querySelector('input[data-id="' + id + '"]');
    if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }
  function onArrow(nod, dir) {
    const zr = zoomRoot();
    const ids = [zr.id].concat(visible(zr).map(n => n.id));
    const next = ids[ids.indexOf(nod.id) + dir];
    if (next) focusId(next);
  }

  /* ---- render ---- */
  function render() {
    const zr = zoomRoot();
    const path = findPath(root, zoomId) || [root];

    crumbsEl.innerHTML = '';
    if (path.length > 1) {
      path.forEach((n, i) => {
        if (i) {
          const sep = document.createElement('span');
          sep.className = 'crumb-sep';
          sep.textContent = '/';
          crumbsEl.appendChild(sep);
        }
        const last = i === path.length - 1;
        const el = document.createElement(last ? 'span' : 'button');
        el.className = 'crumb' + (last ? ' current' : '');
        el.textContent = (i === 0 ? n.text.trim() || 'Home' : n.text.trim() || 'Untitled');
        if (!last) el.onclick = () => { zoomId = n.id; hidePanel(); render(); };
        crumbsEl.appendChild(el);
      });
    }

    if (document.activeElement !== titleEl) titleEl.value = zr.text;
    titleEl.placeholder = zr.id === root.id ? 'Home' : 'Untitled';
    const k = count(zr);
    countEl.textContent = k + (k === 1 ? ' note' : ' notes');

    treeEl.innerHTML = '';
    const build = (parent, container) => {
      parent.children.forEach(nod => {
        const nodeEl = document.createElement('div');
        nodeEl.className = 'node';
        const row = document.createElement('div');
        row.className = 'row';

        const chev = document.createElement('button');
        chev.className = 'chevron' + (nod.children.length ? '' : ' hidden') + (nod.collapsed ? ' closed' : '');
        chev.tabIndex = -1;
        chev.textContent = '▾';
        chev.setAttribute('aria-label', nod.collapsed ? 'Expand branch' : 'Collapse branch');
        chev.onclick = () => { nod.collapsed = !nod.collapsed; commit(); };

        const dot = document.createElement('button');
        dot.className = 'dot' + (nod.children.length && nod.collapsed ? ' full' : '');
        dot.title = 'Zoom into this note';
        dot.setAttribute('aria-label', 'Zoom into this note');
        dot.tabIndex = -1;
        dot.onclick = () => { zoomId = nod.id; hidePanel(); focusReq = { id: nod.id, caret: 'end' }; render(); };

        const input = document.createElement('input');
        input.className = 'note-input';
        input.value = nod.text;
        input.placeholder = '…';
        input.setAttribute('data-id', nod.id);
        input.oninput = () => { nod.text = input.value; save(); };
        input.onkeydown = e => {
          if (e.key === 'Enter') { e.preventDefault(); onEnter(nod); }
          else if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); onIndent(nod, input.selectionStart || 0); }
          else if (e.key === 'Tab' && e.shiftKey) { e.preventDefault(); onOutdent(nod, input.selectionStart || 0); }
          else if (e.key === 'Backspace' && input.value === '') { e.preventDefault(); onDeleteEmpty(nod); }
          else if (e.key === 'ArrowUp') { e.preventDefault(); onArrow(nod, -1); }
          else if (e.key === 'ArrowDown') { e.preventDefault(); onArrow(nod, 1); }
        };

        row.append(chev, dot, input);
        nodeEl.appendChild(row);
        if (nod.children.length && !nod.collapsed) {
          const kids = document.createElement('div');
          kids.className = 'children';
          build(nod, kids);
          nodeEl.appendChild(kids);
        }
        container.appendChild(nodeEl);
      });
    };
    build(zr, treeEl);

    if (focusReq) {
      const req = focusReq;
      focusReq = null;
      const el = req.id === zr.id ? titleEl : treeEl.querySelector('input[data-id="' + req.id + '"]');
      if (el) {
        el.focus();
        const pos = req.caret === 'end' || req.caret == null ? el.value.length : req.caret;
        el.setSelectionRange(pos, pos);
      }
    }
  }

  /* ---- static wiring ---- */
  titleEl.oninput = () => { zoomRoot().text = titleEl.value; save(); };
  titleEl.onkeydown = e => {
    if (e.key === 'Enter') { e.preventDefault(); addNote(zoomRoot(), 0); }
    else if (e.key === 'ArrowDown') {
      e.preventDefault();
      const first = visible(zoomRoot())[0];
      if (first) focusId(first.id);
    }
  };
  $('brand').onclick = () => { zoomId = root.id; hidePanel(); render(); };
  $('addBtn').onclick = () => addNote(zoomRoot());
  $('closePanel').onclick = hidePanel;
  $('distillBtn').onclick = () => {
    const zr = zoomRoot();
    panelTitleEl.textContent = 'Distilled: ' + (zr.text.trim() || 'Untitled');
    panelBodyEl.innerHTML = renderLite(distillLocal(zr));
    panelEl.hidden = false;
    layoutEl.classList.add('with-panel');
  };
  $('copyBtn').onclick = () => {
    const text = toMarkdown(zoomRoot());
    const done = ok => {
      const btn = $('copyBtn');
      btn.textContent = ok ? 'Copied!' : 'Copy failed';
      setTimeout(() => { btn.textContent = 'Copy MD'; }, 1500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => done(true), () => done(false));
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      ta.remove();
      done(ok);
    }
  };

  render();
})();
</script>
</body>
</html>
